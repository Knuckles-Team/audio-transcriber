name: Connector PR

on: pull_request

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: Knuckles-Team/pipelines/.github/workflows/connector_pr_pipeline.yml@main
    with:
      # pyaudio (the `microphone` extra) needs PortAudio headers the runners lack; it is declared, and CI skips it.
      sync-args: --extra local --extra test --all-groups
