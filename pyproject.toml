[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "audio-transcriber"
version = "1.0.1"
description = "Transcribe your .wav .mp4 .mp3 .flac files to text or record your own audio!"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.11, <3.15"
dependencies = [ "agent-utilities>=1.27.1,<2.0.0", "pyaudio>=0.2.14", "faster-whisper>=1.2.1", "setuptools-rust>=1.13.0",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
local = [ "openai-whisper>=20250625",]
mcp = [ "agent-utilities[mcp]>=1.27.1,<2.0.0", "websockets>=16.1.1",]
agent = [ "agent-utilities[agent-runtime,logfire]>=1.27.1,<2.0.0", "websockets>=16.1.1",]
all = [ "audio-transcriber[mcp,agent]>=1.0.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
audio-transcriber = "audio_transcriber.audio_transcriber:main"
audio-transcriber-mcp = "audio_transcriber.mcp_server:mcp_server"
audio-transcriber-agent = "audio_transcriber.agent_server:agent_server"

[project.entry-points."agent_utilities.skill_providers"]
audio-transcriber = "audio_transcriber.skills"

[project.entry-points."agent_utilities.ontology_providers"]
audio-transcriber = "audio_transcriber.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
audio-transcriber = "audio_transcriber.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
audio-transcriber = "audio_transcriber.prompts"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
audio_transcriber = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.coverage.run]
omit = [
    "audio_transcriber/__main__.py",
]
