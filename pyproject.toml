[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "audio-transcriber"
version = "2.3.4"
description = "Transcribe your .wav .mp4 .mp3 .flac files to text or record your own audio!"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-connector-sdk[mcp]>=0.3.18,<1.0.0", "faster-whisper>=1.2.1", "setuptools-rust>=1.13.0",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
local = [ "openai-whisper>=20250625",]
mcp = [ "agent-connector-sdk[mcp,stream]>=0.3.18,<1.0.0",]
all = [ "audio-transcriber[mcp]>=1.0.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
audio-transcriber = "audio_transcriber.audio_transcriber:main"
audio-transcriber-mcp = "audio_transcriber.mcp_server:mcp_server"

[project.entry-points."agent_connector_sdk.skill_providers"]
audio-transcriber = "audio_transcriber.skills"

[project.entry-points."agent_connector_sdk.ontology_providers"]
audio-transcriber = "audio_transcriber.ontology"

[project.entry-points."agent_connector_sdk.source_connector_providers"]
audio-transcriber = "audio_transcriber.connectors"

[project.entry-points."agent_connector_sdk.prompt_providers"]
audio-transcriber = "audio_transcriber.prompts"

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
audio-transcriber-mcp = "audio_transcriber"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
audio_transcriber = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config", "connector"]

[tool.coverage.run]
omit = [
    "audio_transcriber/__main__.py",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
